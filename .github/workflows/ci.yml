name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject large files (>5 MB) and raw data
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find "{}" -size +5M 2>/dev/null)
          if [ -n "$big" ]; then echo "Large files committed:"; echo "$big"; exit 1; fi
          if git ls-files | grep -E '^datasets/(raw|processed)/' | grep -v '.gitkeep$'; then
            echo "Data files must not be committed"; exit 1; fi
      - name: Reject AI attribution in commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE 'co-authored-by:.*(claude|anthropic)|generated with claude'; then
            echo "AI attribution found in commit messages"; exit 1; fi

  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy
      - name: Pytest (fast tests only)
        run: .venv/bin/pytest -m "not slow" --cov --cov-report=xml
